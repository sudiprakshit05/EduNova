{% extends 'teachers_master.html' %}

{% load static %}

{% block content %}

<style>

    /* Live classroom wrapper */
    .live-class-page {
        width: 100%;
        height: calc(100vh - 120px);
        min-height: 600px;
        overflow: hidden;
    }


    /* ZEGOCLOUD classroom */
    #zego-container {
        width: 100%;
        height: 100%;
        min-height: 600px;
        overflow: hidden;
        border-radius: 8px;
    }


    /* Classroom card */
    .live-class-card {
        width: 100%;
        height: 100%;
        margin: 0;
    }


    .live-class-card .card-body {
        width: 100%;
        height: 100%;
        padding: 0;
    }

</style>


<div class="main-panel">

    <div class="content-wrapper">

        <!-- Page Header -->
        <div class="page-header">

            <h3 class="page-title">
                {{ live_class.title }}
            </h3>

        </div>


        <!-- Live Classroom -->
        <div class="live-class-page">

            <div class="card live-class-card">

                <div class="card-body">

                    <div id="zego-container"></div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ZEGOCLOUD UIKit -->

<script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>


<script>

async function joinLiveClass() {

    try {

        // Request teacher ZEGOCLOUD token
        const response = await fetch(
            "{% url 'generate_zego_token' live_class.id %}"
        );

        const data = await response.json();


        if (!data.success) {

            alert(data.message);
            return;

        }


        // Get information from Django
        const token = data.token;
        const appID = data.app_id;
        const roomID = data.room_id;
        const userID = data.user_id;
        const userName = data.user_name;


        console.log("ZEGOCLOUD App ID:", appID);
        console.log("Room ID:", roomID);
        console.log("Teacher ID:", userID);


        // Generate Kit Token
        const kitToken =
            ZegoUIKitPrebuilt.generateKitTokenForProduction(
                appID,
                token,
                roomID,
                userID,
                userName
            );


        // Create ZEGOCLOUD instance
        const zp = ZegoUIKitPrebuilt.create(kitToken);


        // Join classroom
        zp.joinRoom({

            container:
                document.querySelector("#zego-container"),


            scenario: {
                mode:
                    ZegoUIKitPrebuilt.VideoConference
            },


            /* Teacher can use camera/microphone */
            showPreJoinView: true,

            turnOnCameraWhenJoining: true,

            turnOnMicrophoneWhenJoining: true,


            /* Teacher controls */
            showMyCameraToggleButton: true,

            showMyMicrophoneToggleButton: true,

            showAudioVideoSettingsButton: true,


            /* Teacher can share screen */
            showScreenSharingButton: true,


            /* Chat */
            showTextChat: true,


            /* Participant list */
            showUserList: true,


            /* Automatically adjust classroom layout */
            layout: "Auto",

            showLayoutButton: false

        });

    }


    catch (error) {

        console.error(
            "ZEGOCLOUD TEACHER ERROR:",
            error
        );

        alert(
            "Unable to join the live class."
        );

    }

}


// Start classroom
joinLiveClass();

</script>

{% endblock %}
