<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Failed - EduNova</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .payment-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #ffe8e8;
            color: #dc3545;
            font-size: 42px;
            line-height: 75px;
            font-weight: bold;
        }

        h1 {
            color: #222;
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .order-id {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
            margin-bottom: 25px;
            word-break: break-all;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .retry-btn {
            background: #0d6efd;
            color: white;
        }

        .retry-btn:hover {
            background: #0b5ed7;
        }

        .dashboard-btn {
            background: #eeeeee;
            color: #333;
        }

        .dashboard-btn:hover {
            background: #dddddd;
        }

        .brand {
            color: #0d6efd;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <div class="payment-card">

        <div class="brand">EduNova</div>

        <div class="icon">×</div>

        <h1>Payment Failed</h1>

        <p>
            Unfortunately, your payment was not successful.
            No course enrollment has been created for this payment.
        </p>

        {% if order_id %}
        <div class="order-id">
            <strong>Order ID:</strong><br>
            {{ order_id }}
        </div>
        {% endif %}

        <div class="buttons">

            {% if course_id %}
            <a href="{% url 'course_details' course_id %}"
               class="btn retry-btn">
                Try Again
            </a>
            {% endif %}

        </div>

    </div>

</body>
</html>
